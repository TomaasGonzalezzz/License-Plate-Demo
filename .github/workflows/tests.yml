name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
      - name: Re-score the saved run against the hand-made ground truth
        run: uv run python -m platedemo.evaluate events results/porteria_pexels/events.csv evaluation/ground_truth/porteria_pexels.csv --lists data/listas
